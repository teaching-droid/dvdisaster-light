name: build

on:
  push:
    branches:
      - 'master'
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    strategy:
      matrix:
        arch: [x86_64, arm64]
        include:
          - arch: x86_64
            runs-on: macos-15-intel
          - arch: arm64
            runs-on: macos-15
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v5
      - name: install prerequisites
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install flock gdk-pixbuf dylibbundler create-dmg # glib => already installed
      - name: configure
        run: |
          set +x
          ./configure --with-werror
      - name: make
        run: |
          cat Makefile.config
          make -j$(sysctl -n hw.ncpu || echo 2)
      - name: check executable
        run: |
          ./dvdisaster --version
          ./dvdisaster --version | grep "dvdisaster Light"
      - name: build dist
        run: ./.github/workflows/make-mac-app.sh ${{ github.ref }} ${{ matrix.arch }}
        id: dist
        timeout-minutes: 4
      - name: upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: ${{ steps.dist.outputs.archive }}
      - name: Upload to Draft Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          draft: true
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.dist.outputs.archive }}

  win:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: git diffutils make pkg-config mingw-w64-x86_64-glib2 mingw-w64-x86_64-gcc mingw-w64-x86_64-ntldd-git man zip
      - name: git config
        run: git config --global core.autocrlf input
        shell: bash
      - uses: actions/checkout@v5
      - name: configure
        run: ./configure
      - name: make
        run: nproc && make -j$(nproc)
      - name: check executable
        run: |
          ./dvdisaster.exe --version
          file dvdisaster.exe
          if ./dvdisaster.exe --version | grep dirty; then exit 1; fi
          file dvdisaster.exe | grep -q 'x86-64'
          file dvdisaster.exe | grep -q 'for MS Windows'
          ./dvdisaster.exe --version | grep "dvdisaster Light"
      - name: prepare dist
        run: ./.github/workflows/make-dist.sh ${{ github.ref }}
        id: dist
      - name: check executability of dist from cmd.exe
        shell: cmd
        run: |
          cd dist
          dvdisaster.exe --version
      - name: audit dist for Windows 7 compatibility
        run: |
          fail=0
          for f in dist/*.exe dist/*.dll; do
            objdump -p "$f" > /tmp/imports.txt
            if grep -qiE 'DLL Name: api-ms-win-' /tmp/imports.txt; then
              echo "FAIL: api set import in $f (not present on Windows 7)"
              fail=1
            fi
            if grep -qE 'GetSystemTimePreciseAsFileTime|CreateFile2|CopyFile2|WaitOnAddress|SetThreadDescription|PathCch|GetOverlappedResultEx|VirtualAlloc2|PrefetchVirtualMemory' /tmp/imports.txt; then
              echo "FAIL: post Windows 7 API import in $f"
              fail=1
            fi
          done
          test $fail -eq 0 && echo "Windows 7 import audit passed"
      - name: upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: ${{ steps.dist.outputs.archive }}
      - name: Upload to Draft Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          draft: true
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.dist.outputs.archive }}

  linux64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: install prerequisites
        run: sudo apt update && sudo apt install -y libglib2.0-dev man
      - name: configure
        run: ./configure
      - name: make
        run: nproc && make -j$(nproc) && make static && mv -f dvdisaster-static dvdisaster
      - name: check executable
        run: |
          ./dvdisaster --version && ./dvdisaster --version | grep -q dirty || true
          file dvdisaster && file dvdisaster | grep -q 'ELF 64' && file dvdisaster | grep -q 'statically linked'
      - name: build dist
        run: ./.github/workflows/make-dist.sh ${{ github.ref }}
        id: dist
      - name: upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: ${{ steps.dist.outputs.archive }}
      - name: Upload to Draft Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          draft: true
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.dist.outputs.archive }}
